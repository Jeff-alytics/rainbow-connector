AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: NOAA-first backend worker for The Rainbow Connector

Parameters:
  ImageUri:
    Type: String
  PublishUrl:
    Type: String
    Default: https://therainbowconnector.com/api/satellite-candidates
  PublishSecret:
    Type: String
    NoEcho: true
  NotificationUrl:
    Type: String
    Default: https://therainbowconnector.com/api/notify-alerts
  DotEvidenceUrl:
    Type: String
    Default: https://therainbowconnector.com/api/dot-evidence
  AlertNotifySecret:
    Type: String
    Default: ""
    NoEcho: true
  ReviewEnrichUrl:
    Type: String
    Default: https://therainbowconnector.com/api/review-assessment
  MapTierPublishUrl:
    Type: String
    Default: https://therainbowconnector.com/api/map-tiers-publish
  AlarmNotificationEmail:
    Type: String
    Default: jeffmasher@gmail.com

Resources:
  RainbowResearchBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireRollingDecisionLogs
            Status: Enabled
            Prefix: decision-log/rolling/
            ExpirationInDays: 14
          - Id: ExpireRollingRainFootprints
            Status: Enabled
            Prefix: rain-footprint/rolling/
            ExpirationInDays: 14
          - Id: ExpireRollingOpportunityLedgers
            Status: Enabled
            Prefix: opportunity-ledger/rolling/
            ExpirationInDays: 14

  RainbowWorker:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: Dockerfile.worker
      DockerContext: .
      DockerTag: python3.12-v1
    Properties:
      PackageType: Image
      ImageUri: !Ref ImageUri
      Architectures:
        - arm64
      # Measured over 288 invocations: p50 833 MB, p90 1437, p99 1878, max 1945
      # against the previous 2048 MB ceiling -- 103 MB of headroom on the path
      # that publishes the public map and triggers alert emails. The tail scales
      # with rain extent, so heavier weather would have hit an OOM. Do not lower
      # this below 3008 without a fortnight of peak-window memory data; the
      # invocation costs ~7.7 s so the extra GB is about a dollar a month.
      MemorySize: 3008
      Timeout: 180
      EphemeralStorage:
        Size: 1024
      Environment:
        Variables:
          RAINBOW_PUBLISH_URL: !Ref PublishUrl
          SATELLITE_PUBLISH_SECRET: !Ref PublishSecret
          RAINBOW_NOTIFY_URL: !Ref NotificationUrl
          RAINBOW_DOT_EVIDENCE_URL: !Ref DotEvidenceUrl
          ALERT_NOTIFY_SECRET: !Ref AlertNotifySecret
          RAINBOW_MAX_CANDIDATES: "250"
          RAINBOW_MRMS_STRIDE: "10"
          RAINBOW_CACHE_DIR: /tmp/rainbow-worker
          RAINBOW_RESEARCH_BUCKET: !Ref RainbowResearchBucket
          RAINBOW_SHADOW_FUNCTION: !Ref SunlightShadowWorker
          RAINBOW_MAP_TIER_FUNCTION: !Ref MapTierWorker
          RAINBOW_OPPORTUNITY_LEDGER_FUNCTION: !Ref OpportunityLedgerWorker
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Sid: WriteRollingDecisionLogs
              Effect: Allow
              Action: s3:PutObject
              Resource: !Sub ${RainbowResearchBucket.Arn}/decision-log/rolling/*
            - Sid: WriteRollingRainFootprints
              Effect: Allow
              Action: s3:PutObject
              Resource: !Sub ${RainbowResearchBucket.Arn}/rain-footprint/rolling/*
            - Sid: InvokeSunlightShadowWorker
              Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt SunlightShadowWorker.Arn
            - Sid: InvokeMapTierWorker
              Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt MapTierWorker.Arn
            - Sid: InvokeOpportunityLedgerWorker
              Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt OpportunityLedgerWorker.Arn
      Events:
        FiveMinuteSchedule:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(5 minutes)
            State: ENABLED
            FlexibleTimeWindow:
              Mode: 'OFF'
            RetryPolicy:
              MaximumEventAgeInSeconds: 300
              MaximumRetryAttempts: 1

  SunlightShadowWorker:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: Dockerfile.worker
      DockerContext: .
      DockerTag: python3.12-shadow-v1
    Properties:
      PackageType: Image
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - worker.shadow_lambda.handler
      Architectures:
        - arm64
      MemorySize: 2048
      Timeout: 300
      EphemeralStorage:
        Size: 3072
      EventInvokeConfig:
        DestinationConfig:
          OnFailure:
            Type: SNS
            Destination: !Ref OpportunityLedgerAlarmTopic
      Environment:
        Variables:
          RAINBOW_CACHE_DIR: /tmp/rainbow-shadow
          RAINBOW_RESEARCH_BUCKET: !Ref RainbowResearchBucket
          RAINBOW_REVIEW_ENRICH_URL: !Ref ReviewEnrichUrl
          RAINBOW_RESEARCH_REVIEW_ENABLED: "false"
          REVIEW_ENRICH_SECRET_PARAMETER: /rainbow-connector/review-enrich-secret
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Sid: ReadWriteRollingDecisionLogsForShadowEnrichment
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub ${RainbowResearchBucket.Arn}/decision-log/rolling/*
            - Sid: ReadReviewEnrichmentSecret
              Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/rainbow-connector/review-enrich-secret

  SunlightShadowWorkerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${SunlightShadowWorker}
      RetentionInDays: 14

  MapTierWorker:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: Dockerfile.worker
      DockerContext: .
      DockerTag: python3.12-map-tiers-v1
    Properties:
      PackageType: Image
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - worker.map_tier_lambda.handler
      Architectures:
        - arm64
      MemorySize: 2048
      Timeout: 300
      EphemeralStorage:
        Size: 2048
      EventInvokeConfig:
        DestinationConfig:
          OnFailure:
            Type: SNS
            Destination: !Ref OpportunityLedgerAlarmTopic
      Environment:
        Variables:
          RAINBOW_MAP_TIER_PUBLISH_URL: !Ref MapTierPublishUrl
          SATELLITE_PUBLISH_SECRET: !Ref PublishSecret
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Sid: ReadRollingRainFootprintsForMapTiers
              Effect: Allow
              Action: s3:GetObject
              Resource: !Sub ${RainbowResearchBucket.Arn}/rain-footprint/rolling/*

  MapTierWorkerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${MapTierWorker}
      RetentionInDays: 14

  OpportunityLedgerWorker:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: Dockerfile.worker
      DockerContext: .
      DockerTag: python3.12-opportunity-ledger-v2
    Properties:
      PackageType: Image
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - worker.opportunity_ledger_lambda.handler
      Architectures:
        - arm64
      MemorySize: 3008
      Timeout: 120
      EphemeralStorage:
        Size: 2048
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 120
        MaximumRetryAttempts: 0
        DestinationConfig:
          OnFailure:
            Type: SNS
            Destination: !Ref OpportunityLedgerAlarmTopic
      Environment:
        Variables:
          RAINBOW_RESEARCH_BUCKET: !Ref RainbowResearchBucket
          RAINBOW_CACHE_DIR: /tmp/rainbow-ledger-review
          REVIEW_ENRICH_SECRET_PARAMETER: /rainbow-connector/review-enrich-secret
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Sid: ReadRollingRainFootprintsForOpportunityLedger
              Effect: Allow
              Action: s3:GetObject
              Resource: !Sub ${RainbowResearchBucket.Arn}/rain-footprint/rolling/*
            - Sid: ReadWriteRollingOpportunityLedgers
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub ${RainbowResearchBucket.Arn}/opportunity-ledger/rolling/*
            - Sid: ListRollingOpportunityLedgers
              Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt RainbowResearchBucket.Arn
              Condition:
                StringLike:
                  s3:prefix:
                    - opportunity-ledger/rolling/*
            - Sid: ReadLedgerReviewEnrichmentSecret
              Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/rainbow-connector/review-enrich-secret

  OpportunityLedgerWorkerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${OpportunityLedgerWorker}
      RetentionInDays: 14

  OpportunityLedgerAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmNotificationEmail

  OpportunityLedgerDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Opportunity ledger exceeded the 90-second safety budget.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref OpportunityLedgerWorker
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 90000
      ComparisonOperator: GreaterThanThreshold
      # Missing data means the scan never ran, which is a staleness condition,
      # not a slow run. Breaching here would page "exceeded the 90-second
      # budget" whenever the rain footprint was unavailable. See the
      # invocation alarm below, which owns that signal.
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpportunityLedgerAlarmTopic

  OpportunityLedgerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Opportunity ledger emitted a Lambda error.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref OpportunityLedgerWorker
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      # An absent datapoint means no invocation, not a silent error.
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpportunityLedgerAlarmTopic

  # Owns the "did not run" signal. Period spans three scans so the 4/6-minute
  # cadence alternation cannot leave a legitimately empty 5-minute bucket, and
  # missing data is breaching because total silence IS the failure here.
  OpportunityLedgerStaleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Opportunity ledger stopped running; no invocation in 15 minutes.
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref OpportunityLedgerWorker
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref OpportunityLedgerAlarmTopic

  RainbowWorkerDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Rainbow worker exceeded the scan duration budget.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref RainbowWorker
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 180000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpportunityLedgerAlarmTopic

  RainbowWorkerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Rainbow worker emitted a Lambda error.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref RainbowWorker
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpportunityLedgerAlarmTopic

  RainbowWorkerStaleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Rainbow worker stopped running; no invocation in 15 minutes.
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref RainbowWorker
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref OpportunityLedgerAlarmTopic

  MapTierWorkerDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Map tier worker exceeded the scan duration budget.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref MapTierWorker
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 300000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpportunityLedgerAlarmTopic

  MapTierWorkerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Map tier worker emitted a Lambda error.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref MapTierWorker
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpportunityLedgerAlarmTopic

  MapTierWorkerStaleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Map tier worker stopped running; no invocation in 15 minutes.
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref MapTierWorker
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref OpportunityLedgerAlarmTopic

  SunlightShadowWorkerDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Sunlight shadow worker exceeded the scan duration budget.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref SunlightShadowWorker
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 300000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpportunityLedgerAlarmTopic

  SunlightShadowWorkerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Sunlight shadow worker emitted a Lambda error.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref SunlightShadowWorker
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpportunityLedgerAlarmTopic

  SunlightShadowWorkerStaleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Sunlight shadow worker stopped running; no invocation in 15 minutes.
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref SunlightShadowWorker
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref OpportunityLedgerAlarmTopic
  RainbowWorkerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${RainbowWorker}
      RetentionInDays: 14

Outputs:
  WorkerFunctionArn:
    Value: !GetAtt RainbowWorker.Arn
  ResearchBucketName:
    Value: !Ref RainbowResearchBucket
